<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Character - Arcane Gallery</title>
</head>

<body>

    <header>
        <h2>Arcane Gallery</h2>

        <nav>
            <a href="index.html">Home</a>
            <a href="details.html">Details</a>
            <a href="about.html">About</a>
            <a href="add-character.html">Add Character</a>
        </nav>
    </header>

    <main>

        <h1>Add a Character</h1>

        <p>
            Use this form to add information about an Arcane character.
        </p>

        <form action="#">

            <p>
                <label for="name">Character Name:</label><br>
                <input type="text" id="name" name="name" required>
            </p>

            <p>
                <label for="real-name">Real Name:</label><br>
                <input type="text" id="real-name" name="real-name">
            </p>

            <p>
                <label for="universe">Universe:</label><br>
                <input type="text" id="universe" name="universe" value="Arcane">
            </p>

            <p>
                <label for="region">Region:</label><br>
                <input type="text" id="region" name="region">
            </p>

            <p>
                <label for="role">Role:</label><br>
                <input type="text" id="role" name="role">
            </p>

            <p>
                <label for="appearance">First Appearance:</label><br>
                <input type="text" id="appearance" name="appearance">
            </p>

            <p>
                <label for="image">Image URL:</label><br>
                <input type="url" id="image" name="image">
            </p>

            <p>
                <label for="summary">Character Summary:</label><br>
                <textarea id="summary" name="summary" rows="5" cols="40"></textarea>
            </p>

            <p>
                <label for="personality">Personality:</label><br>
                <textarea id="personality" name="personality" rows="5" cols="40"></textarea>
            </p>

            <p>
                <button type="submit">Add Character</button>
            </p>

        </form>

        <p>
            <a href="index.html">Back to Character Gallery</a>
        </p>

    </main>

</body>

</html>
